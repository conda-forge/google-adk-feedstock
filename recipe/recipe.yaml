schema_version: 1

context:
  name: google-adk
  version: "2.14.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/google_adk-${{ version }}.tar.gz
  sha256: b0033571ca101f6bb8617f4791ada0f141f7ef32b0f21ff32116f1161b32ee3c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - adk = google.adk.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.8,<4
    - pip
  run:
    - cryptography >=42
    - packaging >=21
    - python-multipart >=0.0.9,<1
    - python >=${{ python_min }}
    - aiosqlite >=0.21
    - authlib >=1.9.1,<2
    - click >=8.1.8,<9
    - fastapi >=0.133,<1
    - google-auth >=2.47
    - google-genai >=2.30,<3
    - httpx >=0.27,<1
    - jsonschema >=4.23,<5
    - opentelemetry-api >=1.39,<=1.45.2
    - opentelemetry-sdk >=1.39,<=1.45.2
    - pydantic >=2.12,<3
    - python-dotenv >=1,<2
    - python-graphviz >=0.20.2,<1
    - pyyaml >=6.0.2,<7
    - requests >=2.32.4,<3
    - starlette >=1.3.1,<2
    - tenacity >=9,<10
    - typing_extensions >=4.5,<5
    - uvicorn >=0.34,<1
    - watchdog >=6,<7
    - websockets >=15.0.1,<16
tests:
  - python:
      imports:
        - google.adk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - adk --help

about:
  summary: Agent Development Kit
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/google/adk-python

extra:
  recipe-maintainers:
    - soapy1
    - jan-janssen
